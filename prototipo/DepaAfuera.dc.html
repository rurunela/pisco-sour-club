</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const LINES = [
  { t: 'Manuel: Hace frío. Me encanta.', c: 'feliz', p: 'triste' },
  { t: 'Miguel: ¡Préstame tu gorro, causa!', c: 'enojado', p: 'feliz' },
  { t: 'Manuel: …Ya, toma. Pero me lo devuelves.', c: 'sonrojo', p: 'sonrojo' }
];
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const i = s.i || 0;
    const L = LINES[i];
    return { line: L.t, ce: L.c, pe: L.p, tap: () => this.setState({ i: (i + 1) % LINES.length }) };
  }
}
</script>
