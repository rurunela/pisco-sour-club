<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El depa · Portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Pixelify+Sans:wght@500&family=Karla:wght@400;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #B9B3A8; color: #FFFFFF; font-family: 'Karla', sans-serif">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 520px; background: #C9C2B6"></div>
<div style="position: absolute; left: 40px; top: 120px; width: 140px; height: 180px; background: #DCE6EC; border: 10px solid #EFEBE4"></div>
<div style="position: absolute; left: 0; right: 0; top: 520px; bottom: 0; background: #8A7F72"></div>
<div style="position: absolute; right: 30px; top: 360px; width: 60px; height: 170px; background: #6E8F5E; border-radius: 30px 30px 6px 6px"></div>
<div style="position: absolute; right: 36px; top: 500px; width: 48px; height: 60px; background: #A0522D"></div>
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0,0,0,0.04)"></div>

<div style="position: absolute; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(28,27,58,0.55)">
<a href="Depa.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; color: #FFFFFF; text-decoration: none; font-weight: 700">‹ Cerrar portal</a>
<span style="display: inline-flex; align-items: center; gap: 6px; font-family: 'Pixelify Sans', monospace; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #E5484D"></span>CÁMARA</span>
<button type="button" aria-label="Cambiar de cámara" style="width: 44px; height: 44px; border: 2px solid #FFFFFF; border-radius: 999px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8 A6 6 0 0 1 15 6 M16 12 A6 6 0 0 1 5 14 M15 3 v3 h-3 M5 17 v-3 h3" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; gap: 4px; background: rgba(255,251,243,0.95); border: 3px solid #2B2622; padding: 4px">
<sc-for list="{{faces}}" as="f" hint-placeholder-count="6">
<button type="button" onClick="{{f.pick}}" aria-label="{{f.label}}" aria-pressed="{{f.sel}}" style="flex: 1; height: 48px; border: 2px solid {{f.bd}}; background: {{f.bg}}; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><dc-import name="Oc" kind="{{f.kind}}" expr="{{f.id}}" size="38" hint-size="32px,38px"></dc-import></button>
</sc-for>
</div>

<sc-for list="{{ocs}}" as="o" hint-placeholder-count="2">
<div style="position: absolute; left: {{o.x}}; top: {{o.y}}; transform: rotate({{o.rot}}deg) scale({{o.sc}}); transform-origin: 50% 100%">
<button type="button" onClick="{{o.pick}}" aria-label="{{o.aria}}" style="display: block; border: 2px dashed {{o.bd}}; background: none; padding: 4px; cursor: pointer; position: relative">
<dc-import name="Oc" kind="{{o.kind}}" expr="{{o.expr}}" size="200" flip="{{o.flip}}" hint-size="169px,200px"></dc-import>
<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: -8px; top: -8px; width: 14px; height: 14px; background: #FFFFFF; border: 2px solid #B4452F"></span>
<span style="position: absolute; right: -8px; top: -8px; width: 14px; height: 14px; background: #FFFFFF; border: 2px solid #B4452F"></span>
<span style="position: absolute; left: -8px; bottom: -8px; width: 14px; height: 14px; background: #FFFFFF; border: 2px solid #B4452F"></span>
<span style="position: absolute; right: -8px; bottom: -8px; width: 14px; height: 14px; background: #FFFFFF; border: 2px solid #B4452F"></span>
<span style="position: absolute; left: 50%; top: -34px; width: 18px; height: 18px; margin-left: -9px; border-radius: 999px; background: #B4452F; border: 2px solid #FFFFFF"></span>
</sc-if>
</button>
</div>
</sc-for>

<span style="position: absolute; left: 16px; top: 600px; background: rgba(28,27,58,0.7); padding: 4px 10px; font-size: 12px">Arrastra · pellizca para agrandar · gira con el punto</span>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 18px; background: rgba(28,27,58,0.8); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{flip}}" style="flex: 1; min-height: 44px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-weight: 700; cursor: pointer">Voltear</button>
<button type="button" onClick="{{smaller}}" aria-label="Más pequeño" style="width: 44px; min-height: 44px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 20px; cursor: pointer">−</button>
<button type="button" onClick="{{bigger}}" aria-label="Más grande" style="width: 44px; min-height: 44px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 20px; cursor: pointer">+</button>
<button type="button" onClick="{{rotL}}" aria-label="Girar a la izquierda" style="width: 44px; min-height: 44px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 18px; cursor: pointer">↺</button>
<button type="button" onClick="{{rotR}}" aria-label="Girar a la derecha" style="width: 44px; min-height: 44px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 18px; cursor: pointer">↻</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" style="min-height: 44px; padding: 0 12px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-weight: 700; cursor: pointer">+ Añadir</button>
<a href="Polaroid.dc.html" aria-label="Tomar la foto" style="width: 76px; height: 76px; border-radius: 999px; border: 5px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF"></span></a>
<span style="width: 88px; font-size: 11px; text-align: right; line-height: 1.3">La foto no sale de tu celular</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const EXPRS = [{ id: 'normal', label: 'Normal' }, { id: 'feliz', label: 'Feliz' }, { id: 'enojado', label: 'Enojado' }, { id: 'sonrojo', label: 'Sonrojo' }, { id: 'triste', label: 'Triste' }];
const DEF = { cl: { expr: 'normal', flip: false, sc: 1, rot: 4 }, pe: { expr: 'sonrojo', flip: true, sc: 0.85, rot: -8 } };
class Component extends DCLogic {
  get(k) { const s = this.state || {}; return Object.assign({}, DEF[k], s[k] || {}); }
  upd(patch) { const s = this.state || {}; const k = s.sel || 'cl'; this.setState({ [k]: Object.assign(this.get(k), patch) }); }
  renderVals() {
    const s = this.state || {};
    const sel = s.sel || 'cl';
    const cur = this.get(sel);
    const mk = (k, kind, x, y, name) => {
      const v = this.get(k);
      return { kind: kind, expr: v.expr, flip: v.flip, sc: v.sc, rot: v.rot, x: x, y: y, on: k === sel, bd: k === sel ? '#FFFFFF' : 'transparent', aria: 'Seleccionar a ' + name, pick: () => this.setState({ sel: k }) };
    };
    return {
      faces: EXPRS.map((e) => ({ id: e.id, label: 'Cara ' + e.label, kind: sel === 'pe' ? 'peru' : 'chile', sel: e.id === cur.expr ? 'true' : 'false', bd: e.id === cur.expr ? '#B4452F' : '#E5D8C3', bg: e.id === cur.expr ? '#FFF1D6' : '#FFFFFF', pick: () => this.upd({ expr: e.id }) })),
      ocs: [mk('cl', 'chile', '20px', '330px', 'Chile'), mk('pe', 'peru', '190px', '360px', 'Perú')],
      flip: () => this.upd({ flip: !cur.flip }),
      smaller: () => this.upd({ sc: Math.max(0.5, +(cur.sc - 0.1).toFixed(2)) }),
      bigger: () => this.upd({ sc: Math.min(1.4, +(cur.sc + 0.1).toFixed(2)) }),
      rotL: () => this.upd({ rot: cur.rot - 10 }),
      rotR: () => this.upd({ rot: cur.rot + 10 })
    };
  }
}
</script>
</body>
</html>
