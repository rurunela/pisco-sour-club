<div style="position: absolute; right: 48px; top: 150px; width: 56px; height: 56px; background: #F2C14E"></div>

<div style="position: absolute; left: -10px; top: 380px; width: 140px; height: 60px; background: #C98F5A; clip-path: polygon(0 100%, 20% 40%, 35% 55%, 55% 10%, 80% 60%, 100% 100%)"></div>

<header style="position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
<a href="Home2.dc.html" aria-label="Salir del juego" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #FFFBF3; border: 3px solid #2B2622; color: #2B2622; text-decoration: none; font-family: 'Pixelify Sans', monospace; font-size: 18px">✕</a>
<div style="display: flex; gap: 10px; align-items: center; background: #FFFBF3; border: 3px solid #2B2622; padding: 6px 12px; font-family: 'Pixelify Sans', monospace; font-size: 16px">
<span style="color: #B4452F">♥♥♥</span><span>840 m</span><span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #B7D84B; border: 2px solid #2B2622"></span>7</span>
</div>
<span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #2B2622; color: #F2C14E; font-family: 'Pixelify Sans', monospace; font-size: 13px" aria-label="1 escudo">◆1</span>
</header>

<div style="position: absolute; left: 16px; top: 76px; right: 16px; font-family: 'Pixelify Sans', monospace; font-size: 13px; color: #5B4F45; display: flex; justify-content: space-between"><span>Atacama → Lima</span><span>Récord: 1.240 m</span></div>

<button type="button" onClick="{{jump}}" aria-label="Saltar" style="position: absolute; left: 0; top: 100px; right: 0; bottom: 140px; border: none; background: transparent; cursor: pointer; padding: 0">
<div style="position: absolute; left: 40px; bottom: {{ballBottom}}"><dc-import name="Ball" kind="chile" size="64" hands="{{false}}" hint-size="64px,64px"></dc-import></div>
<div style="position: absolute; left: 34px; bottom: 100px; width: 76px; height: 8px; background: rgba(43,38,34,0.18)"></div>
<svg style="position: absolute; left: 170px; bottom: 104px" width="40" height="56" viewBox="0 0 10 14" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="0" width="2" height="14" fill="#4F7A45"/><rect x="1" y="4" width="2" height="4" fill="#4F7A45"/><rect x="3" y="7" width="1" height="1" fill="#4F7A45"/><rect x="7" y="2" width="2" height="5" fill="#4F7A45"/><rect x="6" y="6" width="1" height="1" fill="#4F7A45"/></svg>
<svg style="position: absolute; left: 252px; bottom: 104px" width="64" height="80" viewBox="0 0 16 20" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="10" width="10" height="5" fill="#F3E3C3"/><rect x="11" y="3" width="3" height="8" fill="#F3E3C3"/><rect x="11" y="1" width="5" height="4" fill="#F3E3C3"/><rect x="12" y="0" width="1" height="1" fill="#D8C29A"/><rect x="14" y="0" width="1" height="1" fill="#D8C29A"/><rect x="12" y="2" width="4" height="1" fill="#111111"/><rect x="4" y="15" width="1" height="4" fill="#D8C29A"/><rect x="6" y="15" width="1" height="4" fill="#D8C29A"/><rect x="10" y="15" width="1" height="4" fill="#D8C29A"/><rect x="12" y="15" width="1" height="4" fill="#D8C29A"/><rect x="2" y="10" width="1" height="2" fill="#F3E3C3"/></svg>
<span style="position: absolute; left: 120px; bottom: 210px; width: 16px; height: 16px; border-radius: 999px; background: #B7D84B; border: 3px solid #2B2622"></span>
<span style="position: absolute; left: 150px; bottom: 230px; width: 16px; height: 16px; border-radius: 999px; background: #B7D84B; border: 3px solid #2B2622"></span>
</button>

<button type="button" onClick="{{openQ}}" aria-label="Letrero con pregunta" style="position: absolute; left: 330px; top: 470px; width: 56px; height: 100px; border: none; background: none; padding: 0; cursor: pointer">
<div style="position: absolute; left: 24px; bottom: 0; width: 8px; height: 60px; background: #7A5233"></div>
<div style="position: absolute; left: 0; top: 0; width: 56px; height: 42px; background: #FFFBF3; border: 3px solid #2B2622; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; font-size: 22px; color: #B4452F">?</div>
</button>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: #C98F5A; border-top: 4px solid #2B2622; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 20px; color: #FFFBF3">TOCA PARA SALTAR</span>
<span style="font-size: 14px; color: #FFF3E0">Mantén presionado para salto largo</span>
<span style="display: flex; gap: 16px"><a href="RunnerFin.dc.html" style="font-size: 13px; color: #FFFBF3; font-weight: 700">Demo: ganar →</a><a href="RunnerGameOver.dc.html" style="font-size: 13px; color: #FFFBF3; font-weight: 700">Demo: perder →</a></span>
</div>

<sc-if value="{{q}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(43,38,34,0.55); display: flex; align-items: center; justify-content: center; padding: 20px">
<div style="width: 100%; background: #FFFBF3; border: 4px solid #2B2622; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 14px; color: #B4452F">LETRERO 2 · TRIVIA</span>
<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 22px; line-height: 1.3">¿A qué hora suele tomarse la once en Chile?</p>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" style="min-height: 48px; text-align: left; padding: 0 14px; border: 3px solid {{o.bd}}; background: {{o.bg}}; color: #2B2622; font-family: 'Karla', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
<sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 15px; font-weight: 700; color: #1F4E79">{{feedback}}</p>
<button type="button" onClick="{{closeQ}}" style="min-height: 48px; border: none; background: #1F4E79; color: #FFFBF3; font-family: 'Pixelify Sans', monospace; font-size: 16px; cursor: pointer">SEGUIR CORRIENDO</button>
</sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const OPTS = ['A las 11 de la mañana', 'En la tarde, cerca de las cinco', 'A medianoche'];
const RIGHT = 1;
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state || {};
    const ans = s.ans === undefined ? -1 : s.ans;
    return {
      ballBottom: s.j ? '250px' : '108px',
      jump: () => {
        this.setState({ j: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ j: false }), 450);
      },
      q: !!s.q,
      openQ: () => this.setState({ q: true, ans: -1 }),
      closeQ: () => this.setState({ q: false }),
      answered: ans >= 0,
      feedback: ans === RIGHT ? '¡Exacto! Manuel gana un escudo. «A las cinco en punto, como debe ser.»' : 'Casi… -50 m. Manuel suspira: «Es en la tarde, po».',
      opts: OPTS.map((label, i) => {
        let bg = '#FFFBF3', bd = '#2B2622';
        if (ans >= 0 && i === RIGHT) { bg = '#DCEFD3'; bd = '#4F7A45'; }
        if (ans >= 0 && i === ans && ans !== RIGHT) { bg = '#F6D5CF'; bd = '#B4452F'; }
        return { label: label, bg: bg, bd: bd, pick: () => this.setState({ ans: i }) };
      })
    };
  }
}
</script>
</body>
</html>
