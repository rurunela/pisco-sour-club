name: Validar datos

on:
  push:
    paths: ['data/**']
  pull_request:
    paths: ['data/**']

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar JSON, ids repetidos y claves de textos
        run: node .github/scripts/validar-datos.mjs
